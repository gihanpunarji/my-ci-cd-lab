name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
    contents: read

jobs:
    verify:
        name: Verify
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            
            - name : Use node js 24
              uses: actions/setup-node@v7
              with:
                    node-version: 24
                    cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run verify script
              run: npm run verify

           